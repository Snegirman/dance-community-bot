[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dance-community-bot"
version = "0.1.0"
description = "Telegram-бот для расписания занятий и событий танцевального сообщества"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
dance-community-bot = "dance_community_bot.__main__:main"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dance_community_bot"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
